<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SONG QUIZ</title>
<meta name="description" content="팬이 만든 비공식 곡 맞히기 퀴즈 · ファンメイドの非公式曲当てクイズ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <a class="logo" href="#/"><span class="logo-dot"></span>SONG QUIZ</a>
  <div class="top-r">
    <button type="button" class="chip room-btn" id="roomBtn" data-t="📡 방"></button>
    <button type="button" class="icon-btn" id="sfxBtn">🔊</button>
    <button type="button" class="icon-btn" id="helpBtn" aria-label="도움말" data-t-label="도움말">?</button>
    <div class="lang" id="lang">
      <button type="button" data-lang="ko">한국어</button><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- 아티스트 고르기 -->
  <section id="home" class="view">
    <h1 class="home-title" data-t="좋아하는 아티스트의 곡으로 퀴즈를 풀어 봐요"></h1>
    <p class="home-sub" data-t="힌트를 하나씩 열며 곡을 맞히는 스무고개 퀴즈, 발매일 · 조회수 Up & Down, 최애 무대 월드컵이 있어요"></p>
    <div class="artists" id="artistList"></div>
  </section>

  <!-- 아티스트별 게임 -->
  <section id="game" class="view" hidden>
    <div class="artist-head">
      <a class="back" href="#/" data-t="← 아티스트"></a>
      <h2 id="artistName"></h2>
      <div class="lvl" id="lvl" hidden>
        <button type="button" data-lvl="normal" data-t="일반"></button><button type="button" data-lvl="hard" data-t="하드"></button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a data-mode="quiz" data-t="힌트 퀴즈"></a>
      <a data-mode="listen" data-t="듣기 퀴즈"></a>
      <a data-mode="trivia"></a>
      <a data-mode="updown" data-t="Up & Down"></a>
      <a data-mode="cup" data-t="월드컵"></a>
    </nav>

    <!-- 힌트 퀴즈 (스무고개) -->
    <div id="quizView" class="panel" hidden>
      <div class="q-bar">
        <span class="q-no" id="qNo"></span>
        <div class="q-tools">
          <select id="qRange" aria-label="출제 범위">
            <option value="all" data-t="전체 곡"></option>
            <option value="single" data-t="싱글 · 배포 싱글만"></option>
          </select>
          <button type="button" class="chip" id="qMedia"></button>
          <button type="button" class="chip" id="qBig" data-t="크게 보기"></button>
          <button type="button" class="chip" id="qFull" data-t="전체 화면"></button>
        </div>
      </div>
      <div class="q-score" id="qScore"></div>

      <div class="q-answer" id="qAnswer" hidden>
        <div class="qa-title" id="qaTitle"></div>
        <div class="qa-song" id="qaSong"></div>
        <div class="qa-media" id="qaMedia" hidden></div>
        <dl class="qa-meta" id="qaMeta"></dl>
        <button type="button" class="btn main qa-next" id="nextBtn2" data-t="다음 문제 →"></button>
      </div>

      <ol class="hints" id="hints"></ol>
      <div class="q-wrong" id="qWrong" hidden></div>


      <div class="q-input" id="qInput">
        <input id="answerInput" type="text" autocomplete="off" spellcheck="false" data-t-ph="정답을 적어 주세요 (한국어 · 일본어 · 영어)">
        <button type="button" class="btn main" id="checkBtn" data-t="답 확인"></button>
      </div>
      <div class="q-btns">
        <button type="button" class="btn" id="hintBtn"></button>
        <button type="button" class="btn" id="revealBtn" data-t="정답 공개"></button>
        <button type="button" class="btn main" id="nextBtn" data-t="다음 문제 →"></button>
      </div>
      <p class="q-keys" data-t="키보드 : 스페이스 = 힌트 · 엔터 = 답 확인 · → = 다음 문제"></p>
    </div>

    <!-- 듣기 퀴즈 : 인트로 · 배속(하이라이트) · 아웃트로 -->
    <div id="lsView" class="panel" hidden>
      <div class="ud-kind" id="lsKind">
        <button type="button" data-kind="intro" data-t="인트로 Q"></button>
        <button type="button" data-kind="hl" data-t="배속 Q"></button>
        <button type="button" data-kind="outro" data-t="아웃트로 Q"></button>
        <button type="button" data-kind="mix" data-t="동시 재생 Q"></button>
        <button type="button" data-kind="rev" data-t="리버스 Q"></button>
        <button type="button" data-kind="lyric" data-t="가사 Q"></button>
      </div>
      <div class="q-bar">
        <span class="q-no" id="lsNo"></span>
        <div class="q-tools">
          <select id="lsRate" aria-label="배속">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
          </select>
          <select id="lsMix" aria-label="동시에 틀 곡 수">
            <option value="2" data-t="2곡 동시에"></option>
            <option value="3" data-t="3곡 동시에"></option>
          </select>
          <button type="button" class="chip" id="lsBig" data-t="크게 보기"></button>
        </div>
      </div>
      <div class="q-score" id="lsScore"></div>
      <p class="ls-desc" id="lsDesc"></p>
      <!-- 리버스 Q : 출제자가 가진 음원 파일을 이 브라우저 안에서만 거꾸로 튼다 (어디에도 올라가지 않음) -->
      <div class="ls-extra" id="rvBox" hidden>
        <label class="btn" for="rvFiles" data-t="음원 파일 고르기 (여러 개)"></label>
        <input type="file" id="rvFiles" accept="audio/*" multiple hidden>
        <span class="ls-extra-note" id="rvNote"></span>
      </div>
      <!-- 가사 Q : 출제자가 적어 둔 가사를 기계 음성이 그대로 읽는다 (이 브라우저에만 저장) -->
      <div class="ls-extra" id="lyBox" hidden>
        <details id="lyEdit">
          <summary data-t="가사 목록 편집"></summary>
          <p class="ls-extra-note" data-t="한 줄에 하나씩 「곡 제목 | 읽어 줄 가사」로 적어 주세요. 가사를 한글 발음으로 적으면 한국어 음성이 국어책 읽듯이 읽어요. 이 브라우저에만 저장돼요."></p>
          <textarea id="lyText" rows="8" spellcheck="false" placeholder="青と夏 | ..."></textarea>
        </details>
        <div class="ly-opts">
          <select id="lyVoice" aria-label="음성">
            <option value="auto" data-t="음성 자동 (한글이면 한국어)"></option>
            <option value="ko-KR" data-t="한국어 음성"></option>
            <option value="ja-JP" data-t="일본어 음성"></option>
          </select>
          <select id="lyRate" aria-label="읽는 속도">
            <option value="0.8" data-t="천천히"></option>
            <option value="1" data-t="보통 속도"></option>
            <option value="1.3" data-t="빠르게"></option>
          </select>
          <span class="ls-extra-note" id="lyNote"></span>
        </div>
      </div>

      <div class="ls-player">
        <div id="lsYt"></div>
        <div class="ls-yt-x"><div id="lsYt2"></div></div>
        <div class="ls-yt-x"><div id="lsYt3"></div></div>
        <div class="ls-cover" id="lsCover">
          <!-- 턴테이블 : 소리가 나는 동안 레코드가 돌고 톤암이 내려온다 -->
          <div class="tt" id="lsEq">
            <div class="vinyl">
              <div class="vinyl-label">
                <svg id="lsLabel" viewBox="0 0 64 64" aria-hidden="true"></svg>
                <i class="vinyl-hole"></i>
              </div>
            </div>
            <div class="arm"><i class="arm-base"></i><i class="arm-bar"></i><i class="arm-head"></i></div>
          </div>
          <div class="ls-sec" id="lsSec"></div>
          <p class="ls-msg" id="lsMsg"></p>
          <button type="button" class="chip ls-peek" id="lsPeek" data-t="가리개 잠깐 열기 (광고 건너뛰기)"></button>
        </div>
      </div>
      <div class="ls-ctrl" id="lsCtrl">
        <button type="button" class="btn main big" id="lsPlay"></button>
        <button type="button" class="btn big" id="lsMore"></button>
      </div>

      <div class="q-answer" id="lsAnswer" hidden>
        <div class="qa-title" id="lsaTitle"></div>
        <div class="qa-song" id="lsaSong"></div>
        <button type="button" class="btn main qa-next" id="lsNext2" data-t="다음 문제 →"></button>
      </div>
      <div class="q-wrong ls-found" id="lsFound" hidden></div>
      <div class="q-wrong" id="lsWrong" hidden></div>
      <div class="q-input" id="lsInputBox">
        <input id="lsInput" type="text" autocomplete="off" spellcheck="false" data-t-ph="정답을 적어 주세요 (한국어 · 일본어 · 영어)">
        <button type="button" class="btn main" id="lsCheck" data-t="답 확인"></button>
      </div>
      <div class="q-btns">
        <button type="button" class="btn" id="lsReveal" data-t="정답 공개"></button>
        <button type="button" class="btn main" id="lsNext" data-t="다음 문제 →"></button>
      </div>
      <p class="q-keys" data-t="키보드 : 스페이스 = 듣기 · ↑ = 3초 더 · 엔터 = 답 확인 · → = 다음 문제"></p>
    </div>

    <!-- JAM'S 퀴즈 : 멤버 · 밴드 4지선다, 한 판 10문제 -->
    <div id="tvView" class="panel" hidden>
      <div class="q-bar">
        <span class="q-no" id="tvNo"></span>
        <span class="q-score" id="tvScore"></span>
      </div>
      <div class="tv-card" id="tvCard">
        <div class="tv-q" id="tvQ"></div>
        <div class="tv-opts" id="tvOpts"></div>
        <button type="button" class="btn main tv-next" id="tvNext" hidden></button>
      </div>
      <div class="cup-win" id="tvEnd" hidden>
        <div class="cup-crown" id="tvEndIcon">🍏</div>
        <div class="done-title" id="tvEndTitle"></div>
        <p class="tv-end-msg" id="tvEndMsg"></p>
        <div class="done-btns">
          <button type="button" class="btn main" id="shareTv" data-t="결과 공유"></button>
          <button type="button" class="btn" id="tvAgain" data-t="다시 하기"></button>
        </div>
      </div>
      <p class="ud-note" data-t="문제는 일본어 위키백과에 나온 공개 정보로 만들었어요"></p>
    </div>

    <!-- Up & Down : 발매일 · 조회수 -->
    <div id="udView" class="panel" hidden>
      <div class="ud-kind" id="udKind">
        <button type="button" data-kind="views" data-t="MV 조회수"></button>
        <button type="button" data-kind="date" data-t="발매일"></button>
      </div>
      <div class="hilo-score">
        <span><b id="udStreak">0</b><i data-t="연속"></i></span>
        <span><b id="udBest">0</b><i data-t="최고 기록"></i></span>
      </div>
      <p class="hilo-q" id="udQ"></p>
      <div class="hilo-cards">
        <div class="hcard" id="hcA"><div class="h-thumb"></div><div class="h-title"></div><div class="h-sub"></div><div class="h-date"></div></div>
        <div class="vs">VS</div>
        <div class="hcard" id="hcB"><div class="h-thumb"></div><div class="h-title"></div><div class="h-sub"></div><div class="h-date"></div></div>
      </div>
      <div class="hilo-btns" id="udBtns">
        <button type="button" class="btn big ud-down" data-ans="down"></button>
        <button type="button" class="btn big ud-up" data-ans="up"></button>
      </div>
      <p class="ud-note" id="udNote"></p>
      <div class="hilo-over" id="udOver" hidden>
        <div class="done-title" id="udOverTitle"></div>
        <div class="done-btns">
          <button type="button" class="btn main" id="shareUd" data-t="결과 공유"></button>
          <button type="button" class="btn" id="udRetry" data-t="다시 하기"></button>
        </div>
      </div>
    </div>

    <!-- 월드컵 : 라이브 · 오케스트라 · MV 영상끼리 -->
    <div id="cupView" class="panel" hidden>
      <div class="cup-setup" id="cupSetup">
        <h3 data-t="최애 무대 월드컵"></h3>
        <p data-t="라이브 · 오케스트라 · MV 영상 둘 중 더 좋은 쪽을 골라 최고의 무대를 뽑아요. 같은 곡도 공연마다 따로 나와요."></p>
        <div class="cup-sizes" id="cupSizes"></div>
        <p class="cup-pool" id="cupPool"></p>
      </div>
      <div class="cup-match" id="cupMatch" hidden>
        <div class="cup-round" id="cupRound"></div>
        <div class="cup-pair">
          <div class="cup-side" data-side="0"><div class="cup-video"></div><div class="cup-name"></div><button type="button" class="btn main cup-pick" data-t="이 무대 선택"></button></div>
          <div class="cup-vs">VS</div>
          <div class="cup-side" data-side="1"><div class="cup-video"></div><div class="cup-name"></div><button type="button" class="btn main cup-pick" data-t="이 무대 선택"></button></div>
        </div>
        <button type="button" class="btn cup-quit" id="cupQuit" data-t="처음으로"></button>
      </div>
      <div class="cup-win" id="cupWin" hidden>
        <div class="cup-crown">🏆</div>
        <div class="done-title" data-t="나의 최애 무대"></div>
        <div class="cup-video big" id="cupWinVideo"></div>
        <div class="cup-name big" id="cupWinName"></div>
        <ol class="cup-rank" id="cupRank"></ol>
        <div class="done-btns">
          <button type="button" class="btn main" id="shareCup" data-t="결과 공유"></button>
          <button type="button" class="btn" id="cupAgain" data-t="다시 하기"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <p data-t="비공식 팬메이드예요. 아티스트 · 소속사와는 관계가 없고, 곡 정보는 공개된 자료(위키백과 등)를 바탕으로 정리했어요. 틀린 정보가 있으면 알려 주세요."></p>
</footer>

<!-- 도움말 -->
<div class="modal" id="help" hidden>
  <div class="modal-card">
    <h3 data-t="이렇게 놀아요"></h3>
    <dl class="help-list">
      <dt data-t="힌트 퀴즈"></dt>
      <dd data-t="스무고개처럼 힌트가 하나씩 열려요. 처음엔 막연한 힌트(시기 · 발매 연도)부터, 갈수록 앨범 · 트랙 번호 · 타이업 · 첫 글자처럼 확실한 힌트가 나와요. 답을 적고 「답 확인」을 누르거나, 「정답 공개」로 바로 볼 수 있어요."></dd>
      <dt data-t="여럿이 할 때"></dt>
      <dd data-t="「크게 보기」나 「전체 화면」으로 띄워 놓고, 한 사람이 힌트를 열고 다 같이 맞혀 보세요. 「싱글 · 배포 싱글만」으로 바꾸면 유명한 곡 위주로 나와요."></dd>
      <dt data-t="듣기 퀴즈"></dt>
      <dd data-t="가려진 레코드판에서 곡의 일부분만 들려줘요. 인트로 Q는 처음, 배속 Q는 하이라이트를 빠르게, 아웃트로 Q는 마지막 부분이에요. 3초로 시작해서 3초씩 더 들을 수 있어요. 유튜브 프리미엄이 아니면 광고가 나올 수 있어요."></dd>
      <dt data-t="팬 퀴즈"></dt>
      <dd data-t="아티스트와 멤버에 관한 4지선다 문제가 한 판에 10개 나와요. 생일 · 데뷔 · 수상 · 라이브까지, 진짜 팬이라면 몇 개나 맞힐 수 있을까요? (미세스는 「JAM'S 퀴즈」)"></dd>
      <dt data-t="Up & Down"></dt>
      <dd data-t="오른쪽 곡이 왼쪽 곡보다 나중에 나왔는지(발매일), MV 조회수가 많은지(조회수) UP · DOWN 으로 골라요. 틀릴 때까지 몇 번 연속으로 맞힐 수 있을까요?"></dd>
      <dt data-t="월드컵"></dt>
      <dd data-t="몇 강으로 할지 고르면, 라이브 · 오케스트라 · MV 영상이 둘씩 나와요. 양쪽 영상을 보고 더 좋은 무대를 골라 최애 무대를 뽑아요."></dd>
    </dl>
    <button type="button" class="btn main" id="helpClose" data-t="닫기"></button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/fx.js"></script>

<script src="js/artists/mga.js"></script>

<script src="js/artists/mga-live.js"></script>

<script src="js/artists/vaundy-live.js"></script>
<script src="js/artists/vaundy-clips.js"></script>
